timezone: "Europe/Moscow"  # UTC+3
run_time: "19:00"
concurrency: 4
retry_attempts: 3
dry_run: false

imap:
  default_host: "imap.yandex.ru"
  default_port: 993
  skip_folders:
    - "Spam"

storage:
  local_root: "/data/mail_backups"
  retention_days: 30

s3:
  endpoint_url: "https://s3.storage.selcloud.ru"
  region: "ru-1"
  bucket: "your-bucket"
  prefix: "backups"
  # Для закрытого бакета обычно удобнее явные ключи (если не используются AWS_* env).
  access_key_id: "your-access-key-id"
  secret_access_key: "your-secret-access-key"
  session_token: null
  # Для S3-совместимых приватных инсталляций часто нужен path-style.
  addressing_style: "path" # auto | virtual | path
  signature_version: "s3v4"
  verify_ssl: true # true | false | "/path/to/ca.pem"
  # Необязательно: серверное шифрование на стороне S3.
  server_side_encryption: null # AES256 | aws:kms
  sse_kms_key_id: null
  storage_class: null

logging:
  file: "/data/mail_backups/logs/backup.log"
  retention_days: 30
  level: "INFO"

vault:
  addr: "https://vault.example.com"
  auth_method: "jwt" # jwt | token
  jwt_role: "mail-backuper"
  accounts_base_path: "secret/data/mail-backup/accounts"
  mount: "jwt"
  list_method: "list" # list | get
  list_override_header: false # for get method sends X-HTTP-Method-Override: LIST

limits:
  continue_on_account_error: true
